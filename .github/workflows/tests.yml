name: Tests

on:
  push:
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  validate:
    name: Validate catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java-gradle
      - run: ./gradlew validateCatalog --no-daemon

  api-tests:
    name: API shard ${{ matrix.shard }}/${{ matrix.shard_total }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 0, shard_total: 2 }
          - { shard: 1, shard_total: 2 }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java-gradle

      - name: Run API tests
        run: |
          ./gradlew test -Pgroups=api \
            -PshardIndex=${{ matrix.shard }} \
            -PshardTotal=${{ matrix.shard_total }} \
            --no-daemon

      - uses: ./.github/actions/upload-test-artifacts
        if: always()
        with:
          suite: api
          shard: ${{ matrix.shard }}

  ui-tests:
    name: UI tests
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java-gradle

      - name: Install Playwright Chromium
        run: ./gradlew installPlaywright --no-daemon

      - name: Run UI tests
        run: ./gradlew test -Pgroups=ui --no-daemon

      - uses: ./.github/actions/upload-test-artifacts
        if: always()
        with:
          suite: ui

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: build/playwright-traces
          if-no-files-found: ignore

  report:
    name: Test report
    runs-on: ubuntu-latest
    needs: [api-tests, ui-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
        continue-on-error: true

      - name: Load Allure history and Generate Report
        uses: simple-elf/allure-report-action@v1.9
        id: allure-report
        with:
          allure_results: allure-results
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 20

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add link to Summary
        if: always()
        run: |
          echo "### 🚀 Tests Completed!" >> $GITHUB_STEP_SUMMARY
          echo "Allure Report has been successfully generated and published." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **[Open Allure Report](${{ steps.deployment.outputs.page_url }})**" >> $GITHUB_STEP_SUMMARY