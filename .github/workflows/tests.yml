name: Tests

on:
  push:
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  validate:
    name: Validate catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew validateCatalog --no-daemon

  api-tests:
    name: API shard ${{ matrix.shard }}/${{ matrix.shard_total }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 0, shard_total: 2 }
          - { shard: 1, shard_total: 2 }
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run API tests
        run: |
          ./gradlew test -Pgroups=api \
            -PshardIndex=${{ matrix.shard }} \
            -PshardTotal=${{ matrix.shard_total }} \
            --no-daemon

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api-shard-${{ matrix.shard }}
          path: build/allure-results

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-api-shard-${{ matrix.shard }}
          path: build/test-results/test
          if-no-files-found: ignore

  ui-tests:
    name: UI tests
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Playwright Chromium
        run: ./gradlew installPlaywright --no-daemon

      - name: Run UI tests
        run: ./gradlew test -Pgroups=ui --no-daemon

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui-shard-0
          path: build/allure-results

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-ui-shard-0
          path: build/test-results/test
          if-no-files-found: ignore

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: build/playwright-traces
          if-no-files-found: ignore
report:
    name: Test report
    runs-on: ubuntu-latest
    needs: [api-tests, ui-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4

      # 1. Download Allure results from all shards
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
        continue-on-error: true

      # 2. Download history from the PREVIOUS SUCCESSFUL workflow run
      - name: Download previous Allure history artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: tests.yml # Put your exact workflow file name here if it differs
          name: github-pages
          path: previous-report
          check_artifacts: true
          search_artifacts: true
          workflow_conclusion: success
        continue-on-error: true

      # 3. Move old history to the new results folder
      - name: Prepare Allure history
        run: |
          mkdir -p allure-results/history
          if [ -d "previous-report/history" ]; then
            cp -r previous-report/history/* allure-results/history/
          fi

      # 4. Install official Allure CLI
      - name: Install Allure CLI
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -zxf allure-2.27.0.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      # 5. Generate the HTML report
      - name: Generate Allure Report
        run: |
          allure generate allure-results --clean -o allure-report

      # 6. Upload the generated report folder as a Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      # 7. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 8. Add link to GitHub Summary
      - name: Add link to Summary
        if: always()
        run: |
          echo "### 🚀 Tests Completed!" >> $GITHUB_STEP_SUMMARY
          echo "Allure Report has been successfully generated and published." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **[Open Allure Report](${{ steps.deployment.outputs.page_url }})**" >> $GITHUB_STEP_SUMMARY
