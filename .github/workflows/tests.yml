name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  validate:
    name: Validate catalog
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-java-gradle
      - run: ./gradlew validateCatalog --no-daemon

  api-tests:
    name: API shard ${{ matrix.shard }}/${{ matrix.shard_total }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 0, shard_total: 2 }
          - { shard: 1, shard_total: 2 }
    steps:
      - uses: ./.github/actions/setup-java-gradle

      - name: Run API tests
        run: |
          ./gradlew test -Pgroups=api \
            -PshardIndex=${{ matrix.shard }} \
            -PshardTotal=${{ matrix.shard_total }} \
            --no-daemon

      - uses: ./.github/actions/upload-test-artifacts
        if: always()
        with:
          suite: api
          shard: ${{ matrix.shard }}

  ui-tests:
    name: UI tests
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-java-gradle

      - name: Install Playwright Chromium
        run: ./gradlew installPlaywright --no-daemon

      - name: Run UI tests
        run: ./gradlew test -Pgroups=ui --no-daemon

      - uses: ./.github/actions/upload-test-artifacts
        if: always()
        with:
          suite: ui

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: build/playwright-traces
          if-no-files-found: ignore

  report:
    name: Test report
    runs-on: ubuntu-latest
    needs: [api-tests, ui-tests]
    if: always()
    env:
      ALLURE_PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Download JUnit results
        uses: actions/download-artifact@v4
        with:
          pattern: junit-results-*
          path: merged-junit
        continue-on-error: true

      - uses: ./.github/actions/setup-java-gradle
        with:
          checkout: 'false'

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: incoming-allure
        continue-on-error: true

      - uses: ./.github/actions/restore-allure-history

      - name: Build combined Allure report
        run: bash .github/scripts/build-ci-allure-report.sh

      - name: Upload Allure history
        if: env.skip_publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: allure-history
          path: .allure-history
          retention-days: 90
          if-no-files-found: ignore

      - uses: ./.github/actions/publish-allure-pages
        if: env.skip_publish != 'true'
        id: pages

      - name: Workflow summary
        if: always()
        run: bash .github/scripts/write-ci-summary.sh merged-junit "${{ steps.pages.outputs.page_url }}"
