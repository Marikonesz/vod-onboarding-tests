name: Tests

on:
  push:
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  validate:
    name: Validate catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java-gradle
      - run: ./gradlew validateCatalog --no-daemon

  api-tests:
    name: API shard ${{ matrix.shard }}/${{ matrix.shard_total }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 0, shard_total: 2 }
          - { shard: 1, shard_total: 2 }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java-gradle

      - name: Run API tests
        run: |
          ./gradlew test -Pgroups=api \
            -PshardIndex=${{ matrix.shard }} \
            -PshardTotal=${{ matrix.shard_total }} \
            --no-daemon

      - uses: ./.github/actions/upload-test-artifacts
        if: always()
        with:
          suite: api
          shard: ${{ matrix.shard }}

  ui-tests:
    name: UI tests
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-java-gradle

      - name: Install Playwright Chromium
        run: ./gradlew installPlaywright --no-daemon

      - name: Run UI tests
        run: ./gradlew test -Pgroups=ui --no-daemon

      - uses: ./.github/actions/upload-test-artifacts
        if: always()
        with:
          suite: ui

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: build/playwright-traces
          if-no-files-found: ignore

  report:
    name: Test report
    runs-on: ubuntu-latest
    needs: [api-tests, ui-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4

      # 1. Download Allure results from all shards
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
        continue-on-error: true

      # 2. Install official Allure CLI directly on the runner
      - name: Install Allure CLI
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -zxf allure-2.27.0.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      # 3. Download previous history from GitHub Pages to keep charts/trends
      - name: Download previous Allure history
        run: |
          mkdir -p allure-results/history
          # We fetch the history folder from your live GitHub Pages site
          curl -sSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history/history.json" > allure-results/history/history.json || true
          curl -sSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history/duration-trend.json" > allure-results/history/duration-trend.json || true
          curl -sSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history/categories-trend.json" > allure-results/history/categories-trend.json || true
          curl -sSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history/retry-trend.json" > allure-results/history/retry-trend.json || true

      # 4. Generate the HTML report (Allure CLI will automatically merge the history)
      - name: Generate Allure Report
        run: |
          allure generate allure-results --clean -o allure-report

      # 5. Upload the generated report folder as a Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      # 6. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 7. Add link to GitHub Summary
      - name: Add link to Summary
        if: always()
        run: |
          echo "### 🚀 Tests Completed!" >> $GITHUB_STEP_SUMMARY
          echo "Allure Report has been successfully generated and published." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **[Open Allure Report](${{ steps.deployment.outputs.page_url }})**" >> $GITHUB_STEP_SUMMARY