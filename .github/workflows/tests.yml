name: Tests

on:
  push:
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate catalog
        run: ./gradlew validateCatalog --no-daemon

      - name: Run API tests
        run: ./gradlew test -Pgroups=api --no-daemon

      - name: Generate Allure report
        if: always()
        run: ./gradlew allureReport --no-daemon

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: build/allure-results

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-api
          path: build/reports/allure-report

  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Playwright Chromium
        run: ./gradlew installPlaywright --no-daemon

      - name: Run UI tests
        run: ./gradlew test -Pgroups=ui --no-daemon

      - name: Generate Allure report
        if: always()
        run: ./gradlew allureReport --no-daemon

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ui
          path: build/allure-results

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: build/playwright-traces
          if-no-files-found: ignore

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-ui
          path: build/reports/allure-report
