name: Publish Allure to GitHub Pages
description: Upload report artifact, configure Pages, deploy
inputs:
  report-path:
    description: Path to generated Allure HTML report
    required: false
    default: build/reports/allure-report/allureReport
outputs:
  page_url:
    description: Deployed GitHub Pages URL
    value: ${{ steps.deploy.outputs.page_url }}
runs:
  using: composite
  steps:
    - name: Upload Allure report artifact
      uses: actions/upload-artifact@v4
      with:
        name: allure-report-combined
        path: ${{ inputs.report-path }}

    - name: Configure GitHub Pages
      id: pages
      continue-on-error: true
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      if: steps.pages.outcome == 'success'
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ inputs.report-path }}

    - name: Deploy to GitHub Pages
      id: deploy
      if: steps.pages.outcome == 'success'
      continue-on-error: true
      uses: actions/deploy-pages@v4
