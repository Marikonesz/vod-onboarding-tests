name: Setup Java and Gradle
description: Checkout (optional), JDK 17, Gradle cache
inputs:
  checkout:
    description: Run actions/checkout
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      if: inputs.checkout == 'true'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
