name: Restore Allure history
description: Restore trend history from cache and previous workflow artifact
runs:
  using: composite
  steps:
    - name: Restore Allure history (cache)
      uses: actions/cache@v4
      with:
        path: .allure-history
        key: allure-history-${{ github.ref_name }}
        restore-keys: |
          allure-history-${{ github.ref_name }}
          allure-history-main
          allure-history-

    - name: Download Allure history (previous workflow)
      uses: dawidd6/action-download-artifact@v6
      with:
        github_token: ${{ github.token }}
        workflow: tests.yml
        name: allure-history
        path: .allure-history
        if_no_artifact_found: ignore
        workflow_conclusion: success
      continue-on-error: true
