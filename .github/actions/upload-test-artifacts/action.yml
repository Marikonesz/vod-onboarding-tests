name: Upload test artifacts
description: Upload Allure results and JUnit XML for a test job
inputs:
  suite:
    description: Suite prefix (api or ui)
    required: true
  shard:
    description: Shard index for artifact names
    required: false
    default: '0'
runs:
  using: composite
  steps:
    - name: Upload Allure results
      uses: actions/upload-artifact@v4
      with:
        name: allure-results-${{ inputs.suite }}-shard-${{ inputs.shard }}
        path: build/allure-results

    - name: Upload JUnit results
      uses: actions/upload-artifact@v4
      with:
        name: junit-results-${{ inputs.suite }}-shard-${{ inputs.shard }}
        path: build/test-results/test
        if-no-files-found: ignore
