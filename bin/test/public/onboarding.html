<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Персоналізація профілю</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; }
    .genres { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    button.genre { padding: 0.5rem 1rem; cursor: pointer; }
    button.genre.selected { background: #2563eb; color: #fff; border-color: #2563eb; }
    .movies { margin-top: 1rem; display: none; }
    .movies.visible { display: block; }
    .actions { margin-top: 1.5rem; display: flex; gap: 1rem; }
    #status { margin-top: 1rem; color: #444; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Опитувальник зацікавленостей</h1>
  <p data-testid="step-label">Крок 1: оберіть щонайменше 3 жанри</p>

  <div class="genres" data-testid="genre-list">
    <button type="button" class="genre" data-genre-id="genre-action">Action</button>
    <button type="button" class="genre" data-genre-id="genre-comedy">Comedy</button>
    <button type="button" class="genre" data-genre-id="genre-drama">Drama</button>
    <button type="button" class="genre" data-genre-id="genre-scifi">Sci-Fi</button>
    <button type="button" class="genre" data-genre-id="genre-horror">Horror</button>
    <button type="button" class="genre" data-genre-id="genre-romance">Romance</button>
  </div>

  <div class="movies" data-testid="movies-step">
    <p>Крок 2: оберіть 5 фільмів</p>
    <div data-testid="movie-list">
      <label><input type="checkbox" data-movie-id="movie-1" /> Film 1</label>
      <label><input type="checkbox" data-movie-id="movie-2" /> Film 2</label>
      <label><input type="checkbox" data-movie-id="movie-3" /> Film 3</label>
      <label><input type="checkbox" data-movie-id="movie-4" /> Film 4</label>
      <label><input type="checkbox" data-movie-id="movie-5" /> Film 5</label>
      <label><input type="checkbox" data-movie-id="movie-6" /> Film 6</label>
    </div>
  </div>

  <div class="actions">
    <button type="button" id="next" data-testid="btn-next" disabled>Далі</button>
    <button type="button" id="skip" data-testid="btn-skip">Пропустити</button>
  </div>
  <div id="status" data-testid="status"></div>

  <script>
    const PROFILE_ID = new URLSearchParams(location.search).get('profile_id') || 'profile-demo-1';
    const API = (path) => `/v1/profile/${PROFILE_ID}${path}`;

    const selectedGenres = new Set();
    const selectedMovies = new Set();
    let step = 1;

    const nextBtn = document.getElementById('next');
    const skipBtn = document.getElementById('skip');
    const statusEl = document.getElementById('status');
    const moviesStep = document.querySelector('[data-testid="movies-step"]');
    const stepLabel = document.querySelector('[data-testid="step-label"]');

    document.querySelectorAll('button.genre').forEach((btn) => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.genreId;
        if (selectedGenres.has(id)) {
          selectedGenres.delete(id);
          btn.classList.remove('selected');
        } else {
          selectedGenres.add(id);
          btn.classList.add('selected');
        }
        if (step === 1) {
          nextBtn.disabled = selectedGenres.size < 3;
        }
      });
    });

    document.querySelectorAll('[data-movie-id]').forEach((input) => {
      input.addEventListener('change', () => {
        const id = input.dataset.movieId;
        if (input.checked) selectedMovies.add(id);
        else selectedMovies.delete(id);
        if (step === 2) {
          nextBtn.disabled = selectedMovies.size < 5;
        }
      });
    });

    async function savePreferences(body) {
      const res = await fetch(API('/vod-preferences'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || res.statusText);
      return data;
    }

    async function loadRecommendations() {
      const res = await fetch(API('/recommendations'));
      return res.json();
    }

    nextBtn.addEventListener('click', async () => {
      try {
        if (step === 1) {
          step = 2;
          moviesStep.classList.add('visible');
          stepLabel.textContent = 'Крок 2: оберіть 5 фільмів';
          nextBtn.disabled = true;
          nextBtn.textContent = 'Завершити';
          return;
        }
        await savePreferences({
          genre_ids: [...selectedGenres],
          movie_ids: [...selectedMovies],
          skipped: false,
        });
        const rec = await loadRecommendations();
        statusEl.textContent = `Збережено. Рекомендації: ${rec.source}`;
        statusEl.dataset.recSource = rec.source;
      } catch (e) {
        statusEl.textContent = 'Помилка: ' + e.message;
      }
    });

    skipBtn.addEventListener('click', async () => {
      try {
        await savePreferences({ genre_ids: [], movie_ids: [], skipped: true });
        const rec = await loadRecommendations();
        statusEl.textContent = `Пропущено. Рекомендації: ${rec.source}`;
        statusEl.dataset.recSource = rec.source;
      } catch (e) {
        statusEl.textContent = 'Помилка: ' + e.message;
      }
    });
  </script>
</body>
</html>
